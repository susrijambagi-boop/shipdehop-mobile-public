name: Refresh backend lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Add WhatsApp bridge dependencies
        working-directory: backend
        run: |
          npm install --save-exact @whiskeysockets/baileys@6.7.18 pino@9.10.0
      - name: Commit lockfile
        run: |
          git config user.name "shipdehop-ci"
          git config user.email "actions@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git commit -m "ci: refresh backend lockfile for WhatsApp OTP" || exit 0
          git push
