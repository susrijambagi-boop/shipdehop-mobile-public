name: WhatsApp OTP Backend Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/whatsapp-otp-backend-gate.yml'
      - 'backend/**'
      - 'PRIVATE_RELEASE_SHA'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Compile
        working-directory: backend
        run: npm run build
      - name: Tests
        working-directory: backend
        env:
          NODE_ENV: test
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key-for-tests
          SUPABASE_SECRET_KEY: placeholder-secret-key-for-tests
          GEMINI_API_KEY: placeholder-gemini-key-for-tests
          PAYMENT_PROVIDER: DISABLED
        run: npm test
